# Ground truth for the 2026-10-12 boat test clips, written by the owner from memory
# of what he filmed. Times are MM:SS in the source clip. Used by the eval tool
# to score motion and quality labels; never committed with footage.
# Clips are matched by the 4-digit counter in the file name (dji_mimo_..._NNNN_...).

clips:
  "0051":
    summary: Unusable clip, makes no sense.
    segments:
      - {start: "00:00", end: "00:22", expect_role: accidental}

  "0067":
    summary: Behind the boat, moving away from the mountain; near mountains left and right give parallax.
    segments:
      - {start: "00:00", end: "00:30", expect_move: travel_backward, platform: boat, horizon: level, note: "parallax from the closer mountains on both sides. the owner 2026-10-13: plain linear travel, camera at the stern facing backwards. The far mountain barely changes scale; we pass through a strait, so the shores on both sides converge toward the vanishing point in the centre (radial contraction, the signature of travel_backward) and the wake fills the lower third with water that moves on its own, so global scale flow is near zero and the wake is not a valid flow region"}
      - {start: "00:30", end: "00:44", expect_move: pan_left, platform: boat, horizon: level, note: "turn to watch the left mountain slide past; a bus on the left moves at about the boat's speed"}
      - {start: "00:44", end: "00:55", expect_move: pan_right, platform: boat, horizon: level, note: "same effect to the right; a boat and the mountain recede"}

  "0072":
    summary: Above the boat entering a submarine tunnel in the mountain, then leaving it; ends with a lateral slide.
    segments:
      - {start: "00:20", end: "00:50", expect_move: travel_forward, platform: boat, note: "approach to the tunnel opening"}
      - {start: "00:50", end: "01:20", expect_move: travel_forward, platform: boat, note: "inside the tunnel, camera mostly still; at the end tilts up to the ceiling"}
      - {start: "01:20", end: "01:46", expect_move: complex_motion, platform: boat, note: "short look at the exit, then at the boat"}
      - {start: "01:46", end: "02:43", expect_move: travel_forward, platform: boat, note: "leaving the tunnel"}
      - {start: "02:46", end: "02:55", expect_move: truck_right, platform: boat, note: "side view, mountain slides left, sea, another boat enters frame"}

  "0081":
    summary: Slow rotation with a subject, the owner enters frame; then the boat enters a sea cave, holds at its mouth and backs out.
    segments:
      - {start: "00:00", end: "00:20", expect_move: orbit, note: "slow rotation, subject in frame, then the owner walks into frame"}
      - {start: "00:20", end: "00:40", expect_move: travel_forward, platform: boat, note: "boat enters the cave; camera roughly fixed on the boat, boat bobs up and down"}
      - {start: "00:40", end: "01:10", expect_move: hold, platform: boat, note: "stopped in the cave mouth; boat bobs, cave appears to move"}
      - {start: "01:10", end: "01:35", expect_move: travel_backward, platform: boat, note: "boat backs out of the cave = pull out from the boat"}

  "0083":
    summary: Locked-off starboard shot, two near mountains and one far; another boat enters and approaches.
    segments:
      - {start: "00:00", end: "00:39", expect_move: hold, platform: boat, note: "camera fixed"}
    events:
      - {at: "00:10", what: "faster boat enters frame and slowly approaches"}
      - {at: "00:32", what: "we slow down; the other boat approaches faster"}
      - {at: "00:38", what: "the other boat almost leaves the frame"}

  "0091":
    summary: Orbit around a subject.
    segments:
      - {start: "00:05", end: "00:12", expect_move: orbit}
