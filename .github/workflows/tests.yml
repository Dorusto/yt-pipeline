name: tests
on: [push, pull_request]
jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]  # macOS and Windows parked by the owner (2026-10-21)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt opencv-python-headless numpy pyyaml jsonschema pysubs2 openai filelock mcp psutil pillow pillow-heif psd-tools pytest-timeout pytest-github-actions-annotate-failures
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg melt
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      - name: Check ffmpeg
        run: ffmpeg -version
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: python -m pytest tests/ -q
      - name: Run tests (macOS, Windows)
        if: runner.os != 'Linux'
        run: python -m pytest tests/ -q -m "not needs_melt and not needs_footage"
